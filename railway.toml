# Railway service configuration.
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m kalshi_algo.service.worker"
# Railway pings this to confirm the worker is alive (served by the worker's
# embedded HTTP server on $PORT).
healthcheckPath = "/health"
healthcheckTimeout = 120
# Keep the worker resilient; it persists all state to Postgres + the volume.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
